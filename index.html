    <!-- Application Bootstrap -->
    <script type="module">
        import { WorkoutEngine } from '/src/core/WorkoutEngine.js?v=8';
        import { GarminSync } from '/src/core/GarminSync.js?v=5';
        import { ChatAssistant } from '/src/core/ChatAssistant.js?v=4';
        import { Kai } from '/src/ui/Kai.js?v=30';
        import { SettingsPanel } from '/src/ui/SettingsPanel.js?v=5';

        const syncVisualViewportInset = () => {
            const viewport = window.visualViewport;
            const viewportBottom = viewport
                ? Math.max(0, document.documentElement.clientHeight - viewport.height - viewport.offsetTop)
                : 0;
            document.documentElement.style.setProperty('--visual-viewport-bottom', `${Math.round(viewportBottom)}px`);
        };

        let viewportSyncFrame = 0;
        const requestVisualViewportSync = () => {
            if (viewportSyncFrame) return;
            viewportSyncFrame = requestAnimationFrame(() => {
                viewportSyncFrame = 0;
                syncVisualViewportInset();
            });
        };

        syncVisualViewportInset();
        window.addEventListener('resize', requestVisualViewportSync, { passive: true });
        window.visualViewport?.addEventListener('resize', requestVisualViewportSync, { passive: true });
        window.visualViewport?.addEventListener('scroll', requestVisualViewportSync, { passive: true });

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/public/service-worker.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        // Initialize Architecture
        document.addEventListener('DOMContentLoaded', () => {
            const engine = new WorkoutEngine();
            const garmin = new GarminSync();
            const chat = new ChatAssistant();
            const kai = new Kai(engine, chat);
            
            // Initialize the UI elements
            import('./src/ui/AuthUI.js').then(module => {
                const authUI = new module.AuthUI(garmin);
                import('./src/ui/SettingsPanel.js').then(settingsModule => {
                    new settingsModule.SettingsPanel(garmin, authUI);
                });
            });
            
            // Boot sequence
            engine.init().then(() => {
                // If garmin sync has saved credentials, it connects
                garmin.connect();
            });
        });
    </script>
